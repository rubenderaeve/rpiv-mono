<svg xmlns="http://www.w3.org/2000/svg" aria-label="rpiv-args — Arguments and shell substitution in skill prompts" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1280 800"><title>rpiv-args — Arguments and shell substitution in skill prompts</title><defs><style>.mono{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.serif{font-family:&apos;Iowan Old Style&apos;,&apos;Hoefler Text&apos;,Charter,&apos;Source Serif Pro&apos;,Georgia,serif}.ink{fill:#ede6d3}.text-quiet{fill:#a8a29e}.text-distant{fill:#9c968d}.ochre{fill:#a8896c}.sage{fill:#8a9580}</style><radialGradient id="wash-ochre" cx="25%" cy="10%" r="65%"><stop offset="0%" stop-color="#a8896c" stop-opacity=".1"/><stop offset="100%" stop-color="#a8896c" stop-opacity="0"/></radialGradient><radialGradient id="wash-sage" cx="85%" cy="90%" r="55%"><stop offset="0%" stop-color="#8a9580" stop-opacity=".07"/><stop offset="100%" stop-color="#8a9580" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="800" fill="#1c1a17"/><rect width="1280" height="800" fill="url(#wash-ochre)"/><rect width="1280" height="800" fill="url(#wash-sage)"/><g fill="none" stroke="#8a9580" stroke-linecap="round" opacity=".45"><path stroke-width="1.1" d="M1120 60 q36 -52 88 -60 q40 -5 68 14"/><path stroke-width=".7" d="M1140 80 q28 -18 60 -14 q24 3 42 14" opacity=".6"/><circle cx="1210" cy="32" r="2" opacity=".5"/><circle cx="1160" cy="60" r="1.4" opacity=".4"/></g><text x="80" y="64" class="mono text-distant" font-size="11" letter-spacing=".18em">PI AGENT EXTENSION</text><text x="80" y="152" class="serif ink" font-size="80" font-weight="700" letter-spacing="-2.5">rpiv<tspan class="ochre">-</tspan>args</text><text x="80" y="196" class="mono text-quiet" font-size="19" letter-spacing=".2">Arguments and shell output, baked into the skill prompt.</text><line x1="80" x2="1200" y1="228" y2="228" stroke="#2e2b27" stroke-width="1"/><rect width="1120" height="440" x="80" y="264" fill="#252220" stroke="#3a3631" stroke-width="1" rx="3"/><line x1="640" x2="640" y1="300" y2="668" stroke="#3a3631" stroke-width="1"/><text x="120" y="316" class="mono ochre" font-size="12" font-weight="700" letter-spacing=".2em">A — ARGUMENTS</text><text x="120" y="354" class="mono" font-size="17"><tspan class="sage" font-weight="700">❯</tspan> <tspan class="ink">/skill:deploy api production</tspan></text><text x="120" y="398" class="mono text-distant" font-size="11" letter-spacing=".2em">SKILL BODY</text><text x="120" y="432" class="mono" font-size="17" xml:space="preserve"><tspan class="text-distant">Deploy service </tspan><tspan class="ochre" font-weight="700">$1</tspan><tspan class="text-distant"> to </tspan><tspan class="ochre" font-weight="700">$2</tspan><tspan class="text-distant">.</tspan></text><text x="120" y="458" class="mono" font-size="17" xml:space="preserve"><tspan class="text-distant">Tag: </tspan><tspan class="ochre" font-weight="700">$ARGUMENTS</tspan></text><text x="356" y="502" class="mono sage" font-size="20" font-weight="700" text-anchor="middle">↓</text><text x="120" y="544" class="mono text-distant" font-size="11" letter-spacing=".2em">RENDERED</text><text x="120" y="578" class="mono ink" font-size="17" xml:space="preserve">Deploy service <tspan class="sage" font-weight="700">api</tspan> to <tspan class="sage" font-weight="700">production</tspan>.</text><text x="120" y="604" class="mono ink" font-size="17" xml:space="preserve">Tag: <tspan class="sage" font-weight="700">api production</tspan></text><text x="120" y="654" class="mono" font-size="11" letter-spacing=".1em"><tspan class="sage">✓</tspan> <tspan class="text-distant">POSITIONAL + FULL</tspan></text><text x="680" y="316" class="mono ochre" font-size="12" font-weight="700" letter-spacing=".2em">B — SHELL SUBSTITUTION</text><text x="680" y="354" class="mono" font-size="17"><tspan class="sage" font-weight="700">❯</tspan> <tspan class="ink">/skill:commit</tspan></text><text x="680" y="398" class="mono text-distant" font-size="11" letter-spacing=".2em">SKILL BODY</text><text x="680" y="432" class="mono" font-size="17" xml:space="preserve"><tspan class="text-distant">Draft a commit for the diff.</tspan></text><text x="680" y="458" class="mono" font-size="17" xml:space="preserve"><tspan class="ochre" font-weight="700">!`git status -s`</tspan></text><text x="680" y="484" class="mono" font-size="17" xml:space="preserve"><tspan class="ochre" font-weight="700">!`git log -3 --oneline`</tspan></text><text x="916" y="518" class="mono sage" font-size="20" font-weight="700" text-anchor="middle">↓</text><text x="680" y="550" class="mono text-distant" font-size="11" letter-spacing=".2em">RENDERED</text><text x="680" y="578" class="mono ink" font-size="16" xml:space="preserve">Draft a commit for the diff.</text><text x="680" y="602" class="mono sage" font-size="15" xml:space="preserve">M src/auth/session.ts</text><text x="680" y="624" class="mono sage" font-size="15" xml:space="preserve">M src/auth/session.test.ts</text><text x="680" y="646" class="mono sage" font-size="15" xml:space="preserve">a3f91c2 fix(auth): refresh token race</text><text x="680" y="676" class="mono" font-size="11" letter-spacing=".1em"><tspan class="sage">✓</tspan> <tspan class="text-distant">EVIDENCE, NOT TOOL CALLS</tspan></text><line x1="80" x2="1200" y1="740" y2="740" stroke="#2e2b27" stroke-width="1"/><text x="80" y="776" class="mono text-distant" font-size="12" letter-spacing=".12em"><tspan class="ochre" font-weight="700">▌ rpiv-args</tspan> <tspan dx="12">│</tspan> <tspan class="sage" dx="12">$1 $2 $ARGUMENTS</tspan> <tspan dx="12">│</tspan> <tspan dx="12">!`cmd`</tspan> <tspan dx="12">│</tspan> <tspan dx="12">npm:@juicesharp/rpiv-args</tspan></text></svg>