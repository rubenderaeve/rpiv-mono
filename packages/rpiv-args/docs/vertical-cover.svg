" y="0" fill="#15120E" stroke="#221E18" stroke-width=".6"/><text x="212" y="23" class="mono accent" font-size="13" font-weight="700" text-anchor="middle">$ARGUMENTS</text><rect width="48" height="36" x="280" y="0" fill="#15120E" stroke="#221E18" stroke-width=".6"/><text x="304" y="23" class="mono accent" font-size="14" font-weight="700" text-anchor="middle">$@</text><rect width="68" height="36" x="336" y="0" fill="#15120E" stroke="#221E18" stroke-width=".6"/><text x="370" y="22" class="mono accent" font-size="12" font-weight="700" text-anchor="middle">${@:N}</text><rect width="48" height="36" x="412" y="0" fill="#15120E" stroke="#221E18" stroke-width=".6"/><text x="436" y="22" class="mono accent" font-size="11" font-weight="700" text-anchor="middle">{@:N:L}</text></g><text x="40" y="1004" class="mono muted" font-size="9" letter-spacing="1.4">1-INDEXED · OUT-OF-RANGE → &quot;&quot; · SHELL-STYLE QUOTING</text><line x1="40" x2="500" y1="1100" y2="1100" stroke-dasharray="1 3" stroke-width=".5" class="rule"/><text x="40" y="1118" class="mono muted" font-size="9" letter-spacing="1.8">BYTE-IDENTICAL TO PI’S NATIVE EXPANSION WHEN ABSENT.</text><line x1="40" x2="500" y1="1144" y2="1144" stroke-width="1" class="rule"/><text x="40" y="1168" class="mono muted" font-size="9.5" letter-spacing="1.8"><tspan class="accent">▶</tspan> pi install npm:@juicesharp/rpiv-args</text><text x="500" y="1168" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">SUBSTITUTE</text></svg>