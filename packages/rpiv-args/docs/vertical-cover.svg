<svg xmlns="http://www.w3.org/2000/svg" aria-label="rpiv-args — Shell-style arguments for Pi Agent skills" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 540 1200"><title>rpiv-args — Shell-style arguments for Pi Agent skills</title><defs><style>.mono{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;SFMono-Regular&apos;,ui-monospace,Menlo,Consolas,monospace}.ink{fill:#f4efe6}.paper{fill:#0e0d0b}.muted{fill:#7a7468}.dim{fill:#4a463f}.accent{fill:#ff7a3d}.mint{fill:#6fd0b8}.rule{stroke:#2a2620}.rule-bright{stroke:#ff7a3d}</style><filter id="grain" width="100%" height="100%" x="0" y="0"><feTurbulence baseFrequency="1.4" numOctaves="2" seed="7" type="fractalNoise"/><feColorMatrix values="0 0 0 0 0.96 0 0 0 0 0.94 0 0 0 0 0.88 0 0 0 0.06 0"/></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#161411" stroke-width=".5" d="M32 0 H0 V32"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".6" fill="#231F1A"/></pattern><radialGradient id="vignette" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#0E0D0B" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient><marker id="chev" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#FF7A3D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M0 0 L10 5 L0 10"/></marker></defs><rect width="540" height="1200" class="paper"/><rect width="540" height="1200" fill="url(#grid)" opacity=".55"/><rect width="540" height="1200" fill="url(#dots)" opacity=".4"/><rect width="540" height="1200" filter="url(#grain)" opacity=".5"/><rect width="540" height="1200" fill="url(#vignette)"/><g fill="none" stroke-width="1" class="rule-bright" opacity=".95"><path d="M24 56 L40 56 M40 40 L40 56"/><path d="M516 56 L500 56 M500 40 L500 56"/><path d="M24 1144 L40 1144 M40 1160 L40 1144"/><path d="M516 1144 L500 1144 M500 1160 L500 1144"/></g><line x1="40" x2="500" y1="56" y2="56" stroke-width="1" class="rule"/><text x="40" y="44" class="mono muted" font-size="9" letter-spacing="2">@JUICESHARP · PI EXTENSION · NO. 002 – ARGS</text><text x="500" y="44" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">MIT · v0.9 · 540 × 1200</text><text x="40" y="124" class="mono ink" font-size="56" font-weight="700" letter-spacing="-2">rpiv<tspan class="accent">-</tspan>args</text><line x1="40" x2="100" y1="138" y2="138" stroke-width="2" class="rule-bright"/><text x="40" y="160" class="mono muted" font-size="12" letter-spacing=".3">Shell-style arguments for Pi Agent skills.</text><text x="40" y="178" class="mono dim" font-size="9" letter-spacing="1.4">$1 · $2 · $ARGUMENTS · $@ · ${@:N} · ${@:N:L}</text><text x="40" y="222" class="mono muted" font-size="9" letter-spacing="2">FIG. 01 — SUBSTITUTION</text><text x="500" y="222" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">SHELL → SKILL → LLM</text><line x1="40" x2="500" y1="232" y2="232" stroke-width=".75" class="rule"/><text x="40" y="278" class="mono dim" font-size="9" letter-spacing="1.8">001 — INVOCATION</text><g transform="translate(40 296)"><rect width="460" height="56" x="0" y="0" fill="#15120E" stroke="#221E18" stroke-width=".75"/><text x="14" y="22" class="mono accent" font-size="13" font-weight="700">$</text><text x="30" y="22" class="mono ink" font-size="13">/skill:deploy api production</text><text x="14" y="44" class="mono muted" font-size="9" letter-spacing="1.4">USER INPUT • SHELL-STYLE QUOTING</text></g><path fill="none" stroke-width="1.6" marker-end="url(#chev)" d="M270 372 L270 432" class="rule-bright"/><text x="290" y="408" class="mono muted" font-size="9" letter-spacing="1.8">PARSE</text><text x="40" y="476" class="mono dim" font-size="9" letter-spacing="1.8">002 — SKILL BODY</text><g transform="translate(40 494)"><rect width="460" height="80" x="0" y="0" 