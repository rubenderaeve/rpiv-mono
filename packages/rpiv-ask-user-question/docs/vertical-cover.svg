<svg xmlns="http://www.w3.org/2000/svg" aria-label="rpiv-ask-user-question — Structured clarifying questions instead of guessing" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 540 1200"><title>rpiv-ask-user-question — Structured clarifying questions instead of guessing</title><defs><style>.mono{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;SFMono-Regular&apos;,ui-monospace,Menlo,Consolas,monospace}.ink{fill:#f4efe6}.paper{fill:#0e0d0b}.muted{fill:#7a7468}.dim{fill:#4a463f}.accent{fill:#ff7a3d}.mint{fill:#6fd0b8}.rule{stroke:#2a2620}.rule-bright{stroke:#ff7a3d}</style><filter id="grain" width="100%" height="100%" x="0" y="0"><feTurbulence baseFrequency="1.4" numOctaves="2" seed="17" type="fractalNoise"/><feColorMatrix values="0 0 0 0 0.96 0 0 0 0 0.94 0 0 0 0 0.88 0 0 0 0.06 0"/></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#161411" stroke-width=".5" d="M32 0 H0 V32"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".6" fill="#231F1A"/></pattern><radialGradient id="vignette" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#0E0D0B" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient></defs><rect width="540" height="1200" class="paper"/><rect width="540" height="1200" fill="url(#grid)" opacity=".55"/><rect width="540" height="1200" fill="url(#dots)" opacity=".4"/><rect width="540" height="1200" filter="url(#grain)" opacity=".5"/><rect width="540" height="1200" fill="url(#vignette)"/><g fill="none" stroke-width="1" class="rule-bright" opacity=".95"><path d="M24 56 L40 56 M40 40 L40 56"/><path d="M516 56 L500 56 M500 40 L500 56"/><path d="M24 1144 L40 1144 M40 1160 L40 1144"/><path d="M516 1144 L500 1144 M500 1160 L500 1144"/></g><line x1="40" x2="500" y1="56" y2="56" stroke-width="1" class="rule"/><text x="40" y="44" class="mono muted" font-size="9" letter-spacing="2">@JUICESHARP · PI EXTENSION · NO. 004 – ASK</text><text x="500" y="44" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">MIT · v0.9 · 540 × 1200</text><text x="40" y="116" class="mono ink" font-size="56" font-weight="700" letter-spacing="-2">rpiv<tspan class="accent">-</tspan>ask-</text><text x="40" y="170" class="mono ink" font-size="56" font-weight="700" letter-spacing="-2">user-question</text><line x1="40" x2="100" y1="184" y2="184" stroke-width="2" class="rule-bright"/><text x="40" y="206" class="mono muted" font-size="12" letter-spacing=".3">Structured clarifying questions, not guesses.</text><text x="40" y="224" class="mono dim" font-size="9" letter-spacing="1.4">TABS · PREVIEW PANE · MULTI-SELECT · NOTES</text><text x="40" y="266" class="mono muted" font-size="9" letter-spacing="2">FIG. 01 — STRUCTURED QUESTIONNAIRE</text><text x="500" y="266" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">ask_user_question()</text><line x1="40" x2="500" y1="276" y2="276" stroke-width=".75" class="rule"/><g transform="translate(40 300)"><rect width="460" height="700" x="0" y="0" fill="#13110D" stroke="#2A2620" stroke-width="1"/><rect width="460" height="26" x="0" y="0" fill="#0E0D0B" stroke="#2A2620" stroke-width=".75"/><rect width="160" height="2" x="0" y="26" fill="#FF7A3D"/><text x="14" y="18" class="mono ink" font-size="10" font-weight="700" letter-spacing="1.4">[ Q1 · FRAMEWORK ]</text><text x="178" y="18" class="mono muted" font-size="10" letter-spacing="1.4">Q2 · STORE</text><text x="290" y="18" class="mono muted" font-size="10" letter-spacing="1.4">Q3</text><text x="446" y="18" class="mono muted" font-size="10" letter-spacing="1.4" text-anchor="end">SUBMIT</text><text x="14" y="58" class="mono accent" font-size="11" letter-spacing="1.4">?</text><text x="32" y="58" class="mono ink" font-size="13">Which framework should the migrated</text><text x="32" y="76" class="mono ink" font-size="13">component target?</text><g transform="translate(14 100)"><text x="0" y="14" class="mono muted" font-size="13">○ React</text><rect width="430" height="20" x="-4" y="22" fill="#13110D" stroke="#2A4D45" stroke-width=".75"/><text x="0" y="36" class="mono mint" font-size="13" font-weight="700">⏺ Vue</text><text x="412" y="36" class="mono mint" font-size="9" font-weight="700" letter-spacing="1.2" text-anchor="end">SELECTED</text><text x="0" y="58" class="mono muted" font-size="13">○ Svelte</text><text x="0" y="80" class="mono dim" font-size="13">… Other (free text)</text></g><text x="14" y="222" class="mono dim" font-size="9" letter-spacing="1.8">PREVIEW • vue example</text><rect width="432" height="160" x="14" y="230" fill="#0E0D0B" stroke="#221E18" stroke-width=".6"/><text x="24" y="252" class="mono mint" font-size="11">&lt;script setup&gt;</text><text x="24" y="270" class="mono ink" font-size="11">import { ref } from <tspan class="accent">&quot;vue&quot;</tspan></text><text x="24" y="288" class="mono ink" font-size="11">const count = ref(0)</text><text x="24" y="306" class="mono ink" font-size="11">function inc() {</text><text x="24" y="324" class="mono ink" font-size="11">count.value++</text><text x="24" y="342" class="mono ink" font-size="11">}</text><text x="24" y="362" class="mono mint" font-size="11">&lt;/script&gt;</text><text x="24" y="378" class="mono muted" font-size="10">…</text><text x="14" y="424" class="mono dim" font-size="9" letter-spacing="1.8">PER-OPTION NOTE • key: n</text><rect width="432" height="40" x="14" y="432" fill="#15120E" stroke="#221E18" stroke-width=".6"/><text x="24" y="450" class="mono ink" font-size="11">team is fluent in Vue, prefer SFC…</text><text x="24" y="464" class="mono muted" font-size="9.5">• travels back with the answer</text><text x="14" y="510" class="mono dim" font-size="9" letter-spacing="1.8">SUBMIT TAB • REVIEW BEFORE SEND</text><rect width="432" height="20" x="14" y="518" fill="#15120E" stroke="#221E18" stroke-width=".6"/><text x="24" y="532" class="mono ink" font-size="11">Q1 ⏺ Vue</text><text x="436" y="532" class="mono mint" font-size="9" font-weight="700" letter-spacing="1.2" text-anchor="end">OK</text><rect width="432" height="20" x="14" y="540" fill="#15120E" stroke="#221E18" stroke-width=".6"/><text x="24" y="554" class="mono muted" font-size="11">Q2 … pinia / vuex (unanswered)</text><text x="436" y="554" class="mono accent" font-size="9" font-weight="700" letter-spacing="1.2" text-anchor="end">!</text><g transform="translate(14 590)"><rect width="44" height="16" x="0" y="0" fill="#15120E" stroke="#2A2620" stroke-width=".5"/><rect width="54" height="16" x="52" y="0" fill="#15120E" stroke="#2A2620" stroke-width=".5"/><rect width="54" height="16" x="114" y="0" fill="#15120E" stroke="#2A2620" stroke-width=".5"/><rect width="38" height="16" x="176" y="0" fill="#15120E" stroke="#2A2620" stroke-width=".5"/><rect width="32" height="16" x="222" y="0" fill="#15120E" stroke="#2A2620" stroke-width=".5"/><text x="6" y="11" class="mono muted" font-size="9" letter-spacing="1.2">Tab</text><text x="58" y="11" class="mono muted" font-size="9" letter-spacing="1.2">Space</text><text x="120" y="11" class="mono muted" font-size="9" letter-spacing="1.2">Enter</text><text x="182" y="11" class="mono muted" font-size="9" letter-spacing="1.2">Esc</text><text x="228" y="11" class="mono muted" font-size="9" letter-spacing="1.2">n</text></g><text x="14" y="640" class="mono dim" font-size="8.5" letter-spacing="1.5">SWITCH • TOGGLE • SUBMIT • CLOSE • NOTE</text><line x1="14" x2="446" y1="664" y2="664" stroke="#2A2620" stroke-dasharray="1 3" stroke-width=".5"/><text x="14" y="684" class="mono accent" font-size="11" font-weight="700">›</text><text x="30" y="684" class="mono muted" font-size="11">chat …</text><text x="446" y="684" class="mono dim" font-size="9" letter-spacing="1.4" text-anchor="end">redirect without leaving</text></g><line x1="40" x2="500" y1="1100" y2="1100" stroke-dasharray="1 3" stroke-width=".5" class="rule"/><text x="40" y="1118" class="mono muted" font-size="9" letter-spacing="1.8">ASK → ANSWER → CONFIRM</text><line x1="40" x2="500" y1="1144" y2="1144" stroke-width="1" class="rule"/><text x="40" y="1168" class="mono muted" font-size="9" letter-spacing="1.6"><tspan class="accent">▶</tspan> pi install npm:@juicesharp/rpiv-ask-user-question</text><text x="500" y="1168" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">CLARIFY</text></svg>