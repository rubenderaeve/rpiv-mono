<svg xmlns="http://www.w3.org/2000/svg" aria-label="rpiv-todo — Persistent todo overlay that survives reload and compaction" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 540 1200"><title>rpiv-todo — Persistent todo overlay that survives reload and compaction</title><defs><style>.mono{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;SFMono-Regular&apos;,ui-monospace,Menlo,Consolas,monospace}.ink{fill:#f4efe6}.paper{fill:#0e0d0b}.muted{fill:#7a7468}.dim{fill:#4a463f}.accent{fill:#ff7a3d}.mint{fill:#6fd0b8}.rule{stroke:#2a2620}.rule-bright{stroke:#ff7a3d}</style><filter id="grain" width="100%" height="100%" x="0" y="0"><feTurbulence baseFrequency="1.4" numOctaves="2" seed="23" type="fractalNoise"/><feColorMatrix values="0 0 0 0 0.96 0 0 0 0 0.94 0 0 0 0 0.88 0 0 0 0.06 0"/></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#161411" stroke-width=".5" d="M32 0 H0 V32"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".6" fill="#231F1A"/></pattern><radialGradient id="vignette" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#0E0D0B" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient><radialGradient id="activeGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6FD0B8" stop-opacity=".35"/><stop offset="80%" stop-color="#6FD0B8" stop-opacity="0"/></radialGradient></defs><rect width="540" height="1200" class="paper"/><rect width="540" height="1200" fill="url(#grid)" opacity=".55"/><rect width="540" height="1200" fill="url(#dots)" opacity=".4"/><rect width="540" height="1200" filter="url(#grain)" opacity=".5"/><rect width="540" height="1200" fill="url(#vignette)"/><g fill="none" stroke-width="1" class="rule-bright" opacity=".95"><path d="M24 56 L40 56 M40 40 L40 56"/><path d="M516 56 L500 56 M500 40 L500 56"/><path d="M24 1144 L40 1144 M40 1160 L40 1144"/><path d="M516 1144 L500 1144 M500 1160 L500 1144"/></g><line x1="40" x2="500" y1="56" y2="56" stroke-width="1" class="rule"/><text x="40" y="44" class="mono muted" font-size="9" letter-spacing="2">@JUICESHARP · PI EXTENSION · NO. 006 – TODO</text><text x="500" y="44" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">MIT · v0.9 · 540 × 1200</text><text x="40" y="124" class="mono ink" font-size="56" font-weight="700" letter-spacing="-2">rpiv<tspan class="accent">-</tspan>todo</text><line x1="40" x2="100" y1="138" y2="138" stroke-width="2" class="rule-bright"/><text x="40" y="160" class="mono muted" font-size="12" letter-spacing=".3">A todo list the model keeps across sessions.</text><text x="40" y="178" class="mono dim" font-size="9" letter-spacing="1.4">LIVE OVERLAY · SURVIVES /reload + COMPACT</text><text x="40" y="222" class="mono muted" font-size="9" letter-spacing="2">FIG. 01 — ABOVE-EDITOR WIDGET</text><text x="500" y="222" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">tool: todo · cmd: /todos</text><line x1="40" x2="500" y1="232" y2="232" stroke-width=".75" class="rule"/><text x="40" y="270" class="mono dim" font-size="9" letter-spacing="1.8">STATUS</text><g transform="translate(40 282)"><rect width="460" height="36" x="0" y="0" fill="#15120E" stroke="#221E18" stroke-width=".6"/><text x="14" y="22" class="muted mono" font-size="14">○</text><text x="32" y="22" class="mono muted" font-size="10" letter-spacing="1.2">PENDING</text><text x="116" y="22" class="mint mono" font-size="14" font-weight="700">⏺</text><text x="134" y="22" class="mono mint" font-size="10" font-weight="700" letter-spacing="1.2">IN PROGRESS</text><text x="246" y="22" class="muted mono" font-size="14">●</text><text x="264" y="22" class="mono muted" font-size="10" letter-spacing="1.2">COMPLETED</text><text x="362" y="22" class="dim mono" font-size="14">✕</text><text x="378" y="22" class="mono dim" font-size="10" letter-spacing="1.2">DELETED</text></g><text x="40" y="346" class="mono dim" font-size="9" letter-spacing="1.8">aboveEditor • auto-hides when empty</text><g transform="translate(40 358)"><rect width="460" height="430" x="0" y="0" fill="#13110D" stroke="#2A2620" stroke-width="1"/><rect width="448" height="32" x="6" y="146" fill="url(#activeGlow)"/><rect width="460" height="26" x="0" y="0" fill="#1B0F08"/><text x="14" y="18" class="mono accent" font-size="11" font-weight="700" letter-spacing="1.4">◆ TODOS</text><text x="84" y="18" class="mono muted" font-size="10" letter-spacing="1.2">5 tasks · 1 in_progress · 2 pending</text><text x="446" y="18" class="mono dim" font-size="9" letter-spacing="1.2" text-anchor="end">replay</text><g transform="translate(14 36)"><text x="0" y="22" class="muted mono" font-size="14">●</text><text x="22" y="22" class="muted mono" font-size="11" text-decoration="line-through">Set up CI for the pi extension monorepo</text><text x="430" y="22" class="dim mono" font-size="9" letter-spacing="1.2" text-anchor="end">#01</text><line x1="0" x2="430" y1="38" y2="38" stroke="#221E18" stroke-dasharray="1 3" stroke-width=".5"/><text x="0" y="58" class="muted mono" font-size="14">●</text><text x="22" y="58" class="muted mono" font-size="11" text-decoration="line-through">Wire migrations runner</text><text x="430" y="58" class="dim mono" font-size="9" letter-spacing="1.2" text-anchor="end">#02</text><line x1="0" x2="430" y1="74" y2="74" stroke="#221E18" stroke-dasharray="1 3" stroke-width=".5"/><text x="0" y="94" class="mint mono" font-size="14" font-weight="700">⏺</text><text x="22" y="94" class="ink mono" font-size="11" font-weight="700">Wire advisor selector + reasoning picker</text><text x="430" y="94" class="mint mono" font-size="9" font-weight="700" letter-spacing="1.2" text-anchor="end">#03 ⏺</text><line x1="0" x2="430" y1="110" y2="110" stroke="#221E18" stroke-dasharray="1 3" stroke-width=".5"/><text x="0" y="130" class="muted mono" font-size="14">○</text><text x="22" y="130" class="ink mono" font-size="11">Mount overlay aboveEditor · lazy + idempotent</text><text x="430" y="130" class="dim mono" font-size="9" letter-spacing="1.2" text-anchor="end">#04</text><line x1="0" x2="430" y1="146" y2="146" stroke="#221E18" stroke-dasharray="1 3" stroke-width=".5"/><text x="0" y="166" class="muted mono" font-size="14">○</text><text x="22" y="166" class="ink mono" font-size="11">Cut release v0.9.x · lockstep bump</text><text x="22" y="180" class="accent mono" font-size="9" font-weight="700" letter-spacing="1.2">† blockedBy: #03</text><text x="430" y="166" class="dim mono" font-size="9" letter-spacing="1.2" text-anchor="end">#05</text><line x1="0" x2="430" y1="194" y2="194" stroke="#221E18" stroke-dasharray="1 3" stroke-width=".5"/><text x="0" y="214" class="dim mono" font-size="14">✕</text><text x="22" y="214" class="dim mono" font-size="11" text-decoration="line-through">Patch the websocket reconnect dance</text><text x="430" y="214" class="dim mono" font-size="9" letter-spacing="1.2" text-anchor="end">#06 tombstone</text></g><line x1="14" x2="446" y1="290" y2="290" stroke-dasharray="1 3" stroke-width=".5" class="rule"/><text x="14" y="306" class="mono dim" font-size="9" letter-spacing="1.8">STATE MACHINE</text><text x="14" y="326" class="mono muted" font-size="11">pending → in_progress → completed</text><text x="14" y="344" class="mono muted" font-size="11">↑↓ ↓</text><text x="14" y="362" class="mono muted" font-size="11">pending ←→ deleted (tombstone)</text><text x="14" y="386" class="mono dim" font-size="9" letter-spacing="1.4">replay = reduce(branch) • last-writer-wins</text></g><g transform="translate(40 814)"><line x1="0" x2="460" y1="0" y2="0" stroke-dasharray="2 3" stroke-width=".5" class="rule"/><text x="0" y="-6" class="mono dim" font-size="9" letter-spacing="1.8">EDITOR</text><text x="0" y="22" class="mono accent" font-size="13" font-weight="700">›</text><text x="20" y="22" class="mono muted" font-size="12">_</text><text x="446" y="22" class="mono dim" font-size="9" letter-spacing="1.4" text-anchor="end">12-line collapse threshold</text></g><text x="40" y="900" class="mono muted" font-size="9" letter-spacing="1.4">SURVIVES /reload · SURVIVES SESSION COMPACTION</text><text x="40" y="916" class="mono muted" font-size="9" letter-spacing="1.4">NO DISK PERSISTENCE • STATE = REDUCE(branch)</text><line x1="40" x2="500" y1="1100" y2="1100" stroke-dasharray="1 3" stroke-width=".5" class="rule"/><text x="40" y="1118" class="mono muted" font-size="9" letter-spacing="1.8">PLAN → DO → DONE</text><line x1="40" x2="500" y1="1144" y2="1144" stroke-width="1" class="rule"/><text x="40" y="1168" class="mono muted" font-size="9.5" letter-spacing="1.8"><tspan class="accent">▶</tspan> pi install npm:@juicesharp/rpiv-todo</text><text x="500" y="1168" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">PERSISTENT</text></svg>