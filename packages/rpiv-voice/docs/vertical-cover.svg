nslate(40 786)"><rect width="100" height="48" x="360" y="0" fill="#15120E" stroke="#2A2620" stroke-width=".6"/><text x="410" y="20" class="mono accent" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">PASTE</text><text x="410" y="36" class="mono muted" font-size="9" letter-spacing="1.2" text-anchor="middle">Pi editor</text></g></g><text x="40" y="868" class="mono dim" font-size="9" letter-spacing="1.4">EVERY STAGE LOCAL · AUDIO NEVER LEAVES THE LAPTOP</text><line x1="40" x2="500" y1="896" y2="896" stroke-dasharray="1 3" stroke-width=".5" class="rule"/><g><text x="0" y="12" class="mono dim" font-size="8.5" letter-spacing="1.6" transform="translate(40 916)">MODEL</text><text x="0" y="32" class="mono ink" font-size="13" font-weight="700" transform="translate(40 916)">whisper-base</text><text x="0" y="48" class="mono muted" font-size="9" letter-spacing="1.2" transform="translate(40 916)">multilingual int8</text><text x="160" y="12" class="mono dim" font-size="8.5" letter-spacing="1.6" transform="translate(40 916)">DOWNLOAD</text><text x="160" y="32" class="mono ink" font-size="13" font-weight="700" transform="translate(40 916)">~198 MB</text><text x="160" y="48" class="mono muted" font-size="9" letter-spacing="1.2" transform="translate(40 916)">first run only</text><text x="300" y="12" class="mono dim" font-size="8.5" letter-spacing="1.6" transform="translate(40 916)">ON DISK</text><text x="300" y="32" class="mono ink" font-size="13" font-weight="700" transform="translate(40 916)">~157 MB</text><text x="300" y="48" class="mono muted" font-size="9" letter-spacing="1.2" transform="translate(40 916)">~/.pi/models/</text><text x="400" y="12" class="mono dim" font-size="8.5" letter-spacing="1.6" transform="translate(40 916)">LANGUAGES</text><text x="400" y="32" class="mono ink" font-size="13" font-weight="700" transform="translate(40 916)">~99</text><text x="400" y="48" class="mono muted" font-size="9" letter-spacing="1.2" transform="translate(40 91