<svg xmlns="http://www.w3.org/2000/svg" aria-label="rpiv-voice — Local voice dictation for Pi" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 540 1200"><title>rpiv-voice — Local voice dictation for Pi</title><defs><style>.mono{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;SFMono-Regular&apos;,ui-monospace,Menlo,Consolas,monospace}.ink{fill:#f4efe6}.paper{fill:#0e0d0b}.muted{fill:#7a7468}.dim{fill:#4a463f}.fade{fill:#6a645a}.accent{fill:#ff7a3d}.mint{fill:#6fd0b8}.rec{fill:#e5594e}.rule{stroke:#2a2620}.rule-bright{stroke:#ff7a3d}.rule-mint{stroke:#6fd0b8}</style><filter id="grain" width="100%" height="100%" x="0" y="0"><feTurbulence baseFrequency="1.4" numOctaves="2" seed="31" type="fractalNoise"/><feColorMatrix values="0 0 0 0 0.96 0 0 0 0 0.94 0 0 0 0 0.88 0 0 0 0.06 0"/></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#161411" stroke-width=".5" d="M32 0 H0 V32"/></pattern><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".6" fill="#231F1A"/></pattern><radialGradient id="vignette" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#0E0D0B" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient><radialGradient id="recPulse" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#E5594E" stop-opacity=".45"/><stop offset="100%" stop-color="#E5594E" stop-opacity="0"/></radialGradient></defs><rect width="540" height="1200" class="paper"/><rect width="540" height="1200" fill="url(#grid)" opacity=".55"/><rect width="540" height="1200" fill="url(#dots)" opacity=".4"/><rect width="540" height="1200" filter="url(#grain)" opacity=".5"/><rect width="540" height="1200" fill="url(#vignette)"/><g fill="none" stroke-width="1" class="rule-bright" opacity=".95"><path d="M24 56 L40 56 M40 40 L40 56"/><path d="M516 56 L500 56 M500 40 L500 56"/><path d="M24 1144 L40 1144 M40 1160 L40 1144"/><path d="M516 11