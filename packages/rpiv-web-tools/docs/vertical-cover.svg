NO. 007 – WEB</text><text x="500" y="44" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">MIT · v0.9 · 540 × 1200</text><text x="40" y="124" class="mono ink" font-size="56" font-weight="700" letter-spacing="-2">rpiv<tspan class="accent">-</tspan>web-tools</text><line x1="40" x2="100" y1="138" y2="138" stroke-width="2" class="rule-bright"/><text x="40" y="160" class="mono muted" font-size="12" letter-spacing=".3">Search the web and read pages.</text><text x="40" y="178" class="mono dim" font-size="9" letter-spacing="1.4">BRAVE-BACKED · HTML → TEXT · TRUNCATE-WITH-SPILL</text><text x="40" y="222" class="mono muted" font-size="9" letter-spacing="2">FIG. 01 — SEARCH &amp; FETCH</text><text x="500" y="222" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">web_search() • web_fetch()</text><line x1="40" x2="500" y1="232" y2="232" stroke-width=".75" class="rule"/><text x="40" y="270" class="mono dim" font-size="9" letter-spacing="1.8">001 — web_search</text><g transform="translate(40 282)"><rect width="460" height="36" x="0" y="0" fill="#15120E" stroke="#2A2620" stroke-width="1"/><text x="14" y="22" class="mono accent" font-size="13" font-weight="700">⚲</text><text x="34" y="22" class="mono muted" font-size="11">{ q: <tspan class="ink">&quot;sse vs websockets&quot;</tspan>, count: 3 }</text><rect width="36" height="24" x="416" y="6" fill="#1B0F08" stroke="#FF7A3D" stroke-width=".75"/><text x="434" y="22" class="mono accent" font-size="10" font-weight="700" text-anchor="middle">GET</text></g><g transform="translate(40 332)"><text x="0" y="14" class="mono accent" font-size="11" font-weight="700" letter-spacing="1.4">01</text><text x="22" y="14" class="mono ink" font-size="11" font-weight="700">Server-Sent Events vs WebSockets</text><text x="22" y="28" class="mono mint" font-size="9.5">developer.mozilla.org/…/Server-sent_events</text><text x="22" y="42" class="mono muted" font-size="9.5">SSE is a one-way push channel from server to</text><text x="22" y="54" class="mono muted" font-size="9.5">browser; WS is full-duplex…</text><line x1="0" x2="460" y1="64" y2="64" stroke-dasharray="1 3" stroke-width=".5" class="rule"/><text x="0" y="80" class="mono accent" font-size="11" font-weight="700" letter-spacing="1.4">02</text><text x="22" y="80" class="mono ink" font-size="11" font-weight="700">When to choose SSE over WebSockets</text><text x="22" y="94" class="mono mint" font-size="9.5">ably.com/blog/sse-vs-websockets</text><text x="22" y="108" class="mono muted" font-size="9.5">SSE is simpler to scale through proxies and</text><text x="22" y="120" class="mono muted" font-size="9.5">survives network blips…</text><line x1="0" x2="460" y1="130" y2="130" stroke-dasharray="1 3" stroke-width=".5" class="rule"/><text x="0" y="146" class="mono accent" font-size="11" font-weight="700" letter-spacing="1.4">03</text><text x="22" y="146" class="mono ink" font-size="11" font-weight="700">EventSource: a tour through the standard</text><text x="22" y="160" class="mono mint" font-size="9.5">html.spec.whatwg.org/…/server-sent-events</text><text x="22" y="174" class="mono muted" font-size="9.5">The browser auto-reconnects with</text><text x="22" y="186" class="mono muted" font-size="9.5">Last-Event-ID, replaying missed…</text></g><text x="40" y="544" class="mono dim" font-size="8.5" letter-spacing="1.4">api.search.brave.com · X-Subscription-Token</text><line x1="40" x2="500" y1="568" y2="568" stroke-dasharray="2 3" stroke-width=".5" class="rule"/><text x="40" y="600" class="mono dim" font-size="9" letter-spacing="1.8">002 — web_fetch</text><g transform="translate(40 612)"><rect width="460" height="36" x="0" y="0" fill="#15120E" stroke="#2A2620" stroke-width="1"/><text x="14" y="22" class="mono accent" font-size="13" font-weight="700">↯</text><text x="34" y="22" class="mono muted" font-size="10.5">{ url: <tspan class="ink">&quot;https://…ably.com/blog…&quot;</tspan> }</text><rect width="50" height="24" x="402" y="6" fill="#1B0F08" stroke="#FF7A3D" stroke-width=".75"/><text x="427" y="22" class="mono accent" font-size="10" font-weight="700" text-anchor="middle">200 OK</text></g><text x="40" y="678" class="mono dim" font-size="9" letter-spacing="1.8">HTML → TEXT</text><g transform="translate(40 686)"><rect width="460" height="120" x="0" y="0" fill="#0E0D0B" stroke="#221E18" stroke-width=".6"/><text x="14" y="22" class="mono ink" font-size="11"># When to choose SSE over WebSockets</text><text x="14" y="42" class="mono muted" font-size="11">SSE is a one-way push from server to browser.</text><text x="14" y="58" class="mono muted" font-size="11">It survives most corporate proxies and</text><text x="14" y="74" class="mono muted" font-size="11">traverses CDN layers without renegotiation,</text><text x="14" y="90" class="mono muted" font-size="11">which makes it…</text><text x="14" y="108" class="mono dim" font-size="11">… (88 lines)</text></g><g transform="translate(40 822)"><rect width="460" height="48" x="0" y="0" fill="#15120E" stroke="#FF7A3D" stroke-width="1"/><text x="14" y="20" class="mono accent" font-size="10" font-weight="700" letter-spacing="1.4">[ TRUNCATED • SHOWING 64 of 988 LINES ]</text><text x="14" y="38" class="mono muted" font-size="10">full body → <tspan class="mint">/tmp/rpiv-fetch-Xa9k/content.txt</tspan></text></g><text x="40" y="900" class="mono dim" font-size="8.5" letter-spacing="1.4">env: BRAVE_SEARCH_API_KEY (wins)</text><text x="40" y="916" class="mono dim" font-size="8.5" letter-spacing="1.4">cfg: ~/.config/rpiv-web-tools/config.json • chmod 0600</text><line x1="40" x2="500" y1="1100" y2="1100" stroke-dasharray="1 3" stroke-width=".5" class="rule"/><text x="40" y="1118" class="mono muted" font-size="9" letter-spacing="1.8">SEARCH · FETCH · SPILL</text><line x1="40" x2="500" y1="1144" y2="1144" stroke-width="1" class="rule"/><text x="40" y="1168" class="mono muted" font-size="9" letter-spacing="1.6"><tspan class="accent">▶</tspan> pi install npm:@juicesharp/rpiv-web-tools</text><text x="500" y="1168" class="mono muted" font-size="9" letter-spacing="2" text-anchor="end">FETCH</text></svg>